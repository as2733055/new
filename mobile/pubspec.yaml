name: mobile_chat
description: "A fully working room-based chat app with socket support"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  
  # WebSocket & HTTP
  web_socket_channel: ^2.4.0
  http: ^1.1.0
  
  # Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  
  # Encryption
  encrypt: ^5.0.0
  
  # UI
  google_fonts: ^6.0.0
  badges: ^3.1.0
  
  # Date/Time
  intl: ^0.19.0
  
  # Navigation
  go_router: ^12.0.0
  
  # Other
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
